# =====================================================================================================
# Routing and safety keywords for more Indian languages. Merged into routing.yaml when the app starts.
# Non-Latin keywords match as substrings, so a stem (e.g. Telugu "కరెంట") also matches inflected forms.
# REVIEW STATUS: drafted for the MVP. Each list MUST be reviewed and extended by native speakers; missing
# words mean complaints fall back to an officer (safe), wrong words mean wrong routing (tested by the critic).
# Hindi, English, Hinglish and Chhattisgarhi keywords stay in routing.yaml.
# =====================================================================================================
departments:
  water:
    mr: [पाणी, नळ, हातपंप, बोअरवेल]
    bn: [জল, পানীয়, নলকূপ]
