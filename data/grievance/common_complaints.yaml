note: Frequently filed complaints shown to citizens as optional quick picks. Picking one fills the complaint box; the citizen can still edit it. Needs native-speaker review before public use.
complaints:
  en:
  - department: water
    category: handpump
    text: The handpump in our village is broken and there is no drinking water.
  - department: water
    category: no_supply
    text: Water is not coming in the tap for many days.
  - department: electricity
    category: power_cut
    text: There is no electricity for many days, the transformer is burnt.
  - department: ration
    category: ration_not_given
    text: The ration shop dealer is not giving rice on my ration card.
  - department: pension
    category: pension_not_received
    text: My old age pension has not been received for months.
  - department: roads
    category: potholes
    text: The road has big potholes and is unsafe.
  - department: health
    category: no_doctor_medicine
    text: There is no doctor at the health centre and no medicine.
  - department: education
    category: teacher_absent
    text: The teacher does not come to the school regularly.
